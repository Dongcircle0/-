<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1114">
<title>주간바자 행사 정리기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --primary: #0BD7ED;
    --primary-ink: #001417;
    --primary-soft: rgba(11, 215, 237, .12);
    --primary-line: rgba(11, 215, 237, .35);
    --bg: #0b1114;
    --surface: #121b20;
    --surface-2: #18242a;
    --line: #243339;
    --text: #e8f3f5;
    --muted: #8ea3a9;
    --warn: #ffcf5c;
    --danger: #ff7a7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.5;
    padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header { padding: 22px 0 14px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 12px; }
  .brand small { display: block; color: var(--primary); font-weight: 700; letter-spacing: .08em; font-size: 12px; }
  .brand h1 { margin: 2px 0 0; font-size: 22px; word-break: keep-all; font-weight: 800; letter-spacing: -.02em; }
  .issue-chip {
    flex: none; border: 1px solid var(--primary-line); background: var(--primary-soft); color: var(--primary);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap;
  }


  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .card h2 .num { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); font-size: 12px; display: inline-grid; place-items: center; }

  label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  input, textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus { border-color: var(--primary); }
  textarea { resize: vertical; min-height: 120px; }
  input[type="date"] { color-scheme: dark; min-height: 46px; min-width: 0; -webkit-appearance: none; appearance: none; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .grid2 > * { min-width: 0; }

  button { font: inherit; cursor: pointer; border: 0; }
  .btn { border-radius: 12px; padding: 13px 16px; font-weight: 800; font-size: 15px; }
  .btn-primary { background: var(--primary); color: var(--primary-ink); width: 100%; }
  .btn-primary:disabled { opacity: .45; cursor: default; }
  .btn-ghost { background: var(--surface-2); color: var(--primary); border: 1px solid var(--primary-line); flex: none; padding: 0 14px; font-size: 14px; }
  .btn-text { background: none; color: var(--muted); padding: 8px; font-size: 13px; text-decoration: underline; }

  .drop {
    border: 1.5px dashed var(--primary-line); border-radius: 12px; background: var(--primary-soft);
    min-height: 140px; display: grid; place-items: center; text-align: center; color: var(--muted);
    position: relative; overflow: hidden; padding: 16px;
  }
  .drop strong { color: var(--primary); display: block; font-size: 15px; }
  .drop img { max-width: 100%; max-height: 420px; border-radius: 8px; display: block; }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop .clear { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff; border-radius: 999px; width: 30px; height: 30px; z-index: 2; }

  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .note { font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-top: 10px; background: var(--surface-2); color: var(--muted); }
  .note.ok { color: var(--primary); background: var(--primary-soft); }
  .note.warn { color: var(--warn); background: rgba(255, 207, 92, .1); }
  .note.err { color: var(--danger); background: rgba(255, 122, 122, .1); }

  .missing input, .missing textarea { border-color: rgba(255, 207, 92, .55); }
  .missing label::after { content: " · 정보 없음"; color: var(--warn); font-weight: 600; }

  .preview { border: 1px solid var(--primary-line); border-radius: 12px; padding: 14px; background: linear-gradient(160deg, rgba(11,215,237,.10), rgba(11,215,237,0) 60%); }
  .preview .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--primary); }
  .preview .t { font-size: 17px; font-weight: 800; margin: 6px 0 4px; }
  .preview .l { font-size: 14px; color: var(--text); opacity: .85; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 12px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; padding-top: 0; }
  .list .t { font-weight: 700; }
  .list .m { color: var(--muted); font-size: 13px; }
  .list a { color: var(--primary); text-decoration: none; font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, rgba(11,17,20,0)); z-index: 10;
  }
  .bottom .wrap { padding: 0; }

  .overlay { position: fixed; inset: 0; background: rgba(5,9,11,.78); display: none; place-items: center; z-index: 50; backdrop-filter: blur(3px); }
  .overlay.on { display: grid; }
  .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--primary-soft); border-top-color: var(--primary); animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay p { margin: 0; color: var(--text); font-weight: 700; text-align: center; }
  .overlay small { display: block; color: var(--muted); font-weight: 500; margin-top: 4px; }

  .btn-skip { display: block; margin: 16px auto 0; background: none; border: 1px solid var(--primary-line); color: var(--primary); border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
    background: var(--primary); color: var(--primary-ink); font-weight: 800; padding: 10px 16px; border-radius: 16px; transition: .25s; z-index: 60;
    width: max-content; max-width: min(92vw, 560px); text-align: center; line-height: 1.45; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
  .chips button.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .cat { margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); letter-spacing: 0; }
  .cat:empty { display: none; }
  .list .c { display: inline-block; font-size: 11px; font-weight: 800; color: var(--primary); border: 1px solid var(--primary-line); border-radius: 999px; padding: 0 7px; margin-right: 6px; vertical-align: 2px; }
  .mapping { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 13px; color: var(--muted); }
  .mapping summary { cursor: pointer; font-weight: 700; color: var(--text); }
  .mapping table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .mapping td { padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .mapping td:first-child { color: var(--primary); font-weight: 800; width: 44px; }
  .mapping p { margin: 8px 0 0; }
  .sub { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .hidden { display: none !important; }
  a.sheet { color: var(--primary); font-size: 13px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <small>BAZAAR · WEEKLY</small>
      <h1>주간바자 행사 정리기</h1>
    </div>
    <div class="issue-chip" id="issueChip">불러오는 중…</div>
  </header>

  <!-- 접속 암호 -->
  <section class="card hidden" id="lockCard">
    <h2>접속 암호</h2>
    <div class="field">
      <input id="passInput" type="password" inputmode="text" autocomplete="current-password" placeholder="암호를 입력하세요">
    </div>
    <button class="btn btn-primary" id="passBtn">들어가기</button>
    <div class="note err hidden" id="passErr"></div>
  </section>

  <main id="app" class="hidden">
    <!-- 1. 입력 -->
    <section class="card" id="inputCard">
      <h2><span class="num">1</span>인스타그램 게시물 넣기</h2>

      <div class="field">
        <label for="link">인스타그램 링크</label>
        <div class="row">
          <input id="link" type="url" inputmode="url" placeholder="https://www.instagram.com/p/…" autocomplete="off">
          <button class="btn btn-ghost" id="fetchBtn" type="button">불러오기</button>
        </div>
        <div class="hint">링크만으로 캡션·포스터를 가져와 봅니다. 인스타그램이 막으면 아래에 직접 넣어주세요.</div>
        <div class="note hidden" id="fetchNote"></div>
      </div>

      <div class="field">
        <label>포스터</label>
        <div class="drop" id="drop">
          <div id="dropEmpty"><strong>포스터 이미지 선택</strong>탭해서 사진 선택 · 붙여넣기 · 끌어다 놓기</div>
          <img id="posterImg" class="hidden" alt="포스터 미리보기">
          <button class="clear hidden" id="clearImg" type="button" aria-label="포스터 지우기">✕</button>
          <input id="file" type="file" accept="image/*">
        </div>
      </div>

      <div class="field">
        <label for="caption">캡션</label>
        <textarea id="caption" placeholder="게시물 캡션을 그대로 붙여넣어 주세요"></textarea>
      </div>
    </section>

    <!-- 2. 결과 -->
    <section class="card hidden" id="resultCard">
      <h2><span class="num">2</span>AI 정리 결과 확인</h2>
      <div class="note warn hidden" id="basicNote"></div>
      <div class="note warn hidden" id="dupNote"></div>
      <div class="note warn hidden" id="pastNote"></div>

      <div class="preview" style="margin: 4px 0 18px">
        <div class="tag">주간바자 미리보기 <span id="pvCat" class="cat"></span></div>
        <div class="t" id="pvTitle"></div>
        <div class="l" id="pvDate"></div>
        <div class="l" id="pvVenue"></div>
      </div>

      <div class="field" data-k="category">
        <label>카테고리</label>
        <input data-f="category" list="catList" autocomplete="off">
        <datalist id="catList"></datalist>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="grid2">
        <div class="field" data-k="host"><label>주최</label><input data-f="host"></div>
        <div class="field" data-k="organizer"><label>주관</label><input data-f="organizer"></div>
      </div>
      <div class="grid2">
        <div class="field" data-k="sponsor"><label>후원</label><input data-f="sponsor"></div>
        <div class="field" data-k="account"><label>인스타그램 계정</label><input data-f="account" autocapitalize="off"></div>
      </div>
      <div class="field" data-k="title"><label>행사명</label><input data-f="title"></div>
      <div class="grid2">
        <div class="field" data-k="startDate"><label>시작일</label><input type="date" data-f="startDate"></div>
        <div class="field" data-k="endDate"><label>종료일</label><input type="date" data-f="endDate"></div>
      </div>
      <div class="grid2">
        <div class="field" data-k="time"><label>시간</label><input data-f="time" placeholder="11:00~18:00"></div>
        <div class="field" data-k="dateNote"><label>일정 메모</label><input data-f="dateNote" placeholder="매주 토요일 등"></div>
      </div>
      <div class="grid2">
        <div class="field" data-k="venue"><label>장소</label><input data-f="venue"></div>
        <div class="field" data-k="region"><label>지역</label><input data-f="region" placeholder="서울 마포구"></div>
      </div>
      <div class="field" data-k="summary"><label>내용</label><textarea data-f="summary" style="min-height:80px"></textarea></div>
      <div class="field" data-k="details"><label>세부내용</label><textarea data-f="details" style="min-height:140px"></textarea></div>
      <div class="field">
        <label>발행호 (목요일)</label>
        <input type="date" data-f="issue">
        <div class="hint">등록한 날 기준 다음 목요일 발행호로 자동 지정돼요. '주간바자 정리' 시트가 이 날짜로 묶여요.</div>
      </div>
      <button class="btn-text" id="resetBtn" type="button">처음부터 다시</button>
    </section>

    <!-- 3. 이번 발행호 -->
    <section class="card">
      <h2 style="justify-content: space-between">
        <span style="display:flex;gap:8px;align-items:center"><span class="num">3</span><span><span id="listTitle">이번 주간바자</span><small id="listSub" class="sub"></small></span></span>
        <a class="sheet" id="sheetLink" target="_blank" rel="noopener">시트 열기 ↗</a>
      </h2>
      <ul class="list" id="list"></ul>
      <details class="mapping" id="mapping">
        <summary>바자가자 시트 연결 상태</summary>
        <div id="mapBody"></div>
      </details>
    </section>
  </main>
</div>

<div class="bottom hidden" id="bottom">
  <div class="wrap">
    <button class="btn btn-primary" id="mainBtn" disabled>AI로 정리하기</button>
  </div>
</div>

<div class="overlay" id="overlay"><div><div class="spinner"></div><p id="overlayMsg">정리하는 중…<small></small></p>
  <button class="btn-skip hidden" id="skipBtn" type="button">기다리지 않고 캡션으로 바로 채우기</button></div></div>
<div class="toast" id="toast"></div>

<script>
  var NEEDS_PASSCODE = <?= needsPasscode ? 'true' : 'false' ?>;
  var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  var state = { passcode: '', image: null, event: null, mode: 'input', categories: [] };

  function $(id) { return document.getElementById(id); }
  function show(el, on) { el.classList.toggle('hidden', !on); }

  function store(key, val) {
    try { if (val === undefined) return localStorage.getItem(key) || ''; localStorage.setItem(key, val); } catch (e) { return ''; }
  }

  /** google.script.run → Promise */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, [state.passcode].concat(args));
    });
  }

  function errMsg(e) { return String((e && e.message) || e).replace(/^Error:\s*/, '').replace(/^(PASSCODE|AI_BUSY):\s*/, ''); }
  function isBusy(e) { return /AI_BUSY/.test(String((e && e.message) || e)); }

  function loading(on, msg, sub) {
    $('overlay').classList.toggle('on', on);
    if (msg) $('overlayMsg').innerHTML = msg + '<small>' + (sub || '') + '</small>';
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, Math.max(2400, msg.length * 70));
  }

  function note(el, msg, kind) {
    el.className = 'note ' + (kind || ''); el.textContent = msg; show(el, !!msg);
  }

  /* ───────── 날짜 형식 (서버의 formatDateTime_와 동일) ───────── */
  function parseYmd(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDay(d, y) { return (y ? d.getFullYear() + '.' : '') + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + '(' + WEEKDAYS[d.getDay()] + ')'; }
  function fmtRange(ev, y) {
    var s = parseYmd(ev.startDate), e = parseYmd(ev.endDate);
    if (!s) return '';
    if (!e || e.getTime() === s.getTime()) return fmtDay(s, y);
    return fmtDay(s, y) + ' ~ ' + fmtDay(e, y && s.getFullYear() !== e.getFullYear());
  }
  function fmtDateTime(ev, y) {
    var main = [fmtRange(ev, y), ev.time].filter(Boolean).join(' ');
    return [main, ev.dateNote].filter(Boolean).join(' · ');
  }

  /* ───────── 시작 ───────── */
  function boot() {
    state.passcode = store('wb_passcode');
    if (NEEDS_PASSCODE && !state.passcode) return showLock();
    loadDashboard().then(function () {
      show($('lockCard'), false); show($('app'), true); show($('bottom'), true); updateMain();
    }).catch(function (e) {
      if (/PASSCODE/.test(String(e && e.message || e))) { store('wb_passcode', ''); showLock('암호가 올바르지 않아요.'); }
      else { show($('app'), true); show($('bottom'), true); updateMain(); toast(errMsg(e)); }
    });
  }

  function showLock(err) {
    show($('app'), false); show($('bottom'), false); show($('lockCard'), true);
    $('issueChip').textContent = '🔒';
    if (err) note($('passErr'), err, 'err');
    $('passInput').focus();
  }

  $('passBtn').onclick = function () {
    state.passcode = $('passInput').value.trim();
    store('wb_passcode', state.passcode);
    boot();
  };
  $('passInput').onkeydown = function (e) { if (e.key === 'Enter') $('passBtn').click(); };

  function loadDashboard() {
    return call('getDashboard').then(renderDashboard);
  }

  function renderDashboard(d) {
    $('issueChip').textContent = d.issueLabel + ' 발행 · ' + d.events.length + '건';
    $('listTitle').textContent = d.issueLabel + ' 주간바자';
    $('listSub').textContent = (d.weekLabel || '') + ' 행사';
    $('sheetLink').href = d.sheetUrl;
    setCategories(d.categories);
    renderMapping(d.mapping);
    var ul = $('list'); ul.innerHTML = '';
    if (!d.events.length) { ul.innerHTML = '<li class="empty">아직 이 주(월~일)에 열리는 행사가 없어요.</li>'; return; }
    d.events.forEach(function (ev) {
      var li = document.createElement('li');
      li.innerHTML = '<div><span class="c"></span><span class="t"></span></div><div class="m"></div>' + (ev.link ? '<a target="_blank" rel="noopener">게시물 보기 ↗</a>' : '');
      li.querySelector('.t').textContent = ev.title || '(행사명 없음)';
      var c = li.querySelector('.c'); if (ev.category) c.textContent = ev.category; else c.remove();
      li.querySelector('.m').textContent = [ev.datetime, ev.venue, ev.account ? '@' + ev.account : ''].filter(Boolean).join(' · ');
      if (ev.link) li.querySelector('a').href = ev.link;
      ul.appendChild(li);
    });
  }

  function setCategories(list) {
    state.categories = list || [];
    var dl = $('catList'); dl.innerHTML = '';
    state.categories.forEach(function (c) { var o = document.createElement('option'); o.value = c; dl.appendChild(o); });
    renderChips();
  }

  function renderChips() {
    var box = $('catChips'), cur = document.querySelector('[data-f="category"]').value.trim();
    box.innerHTML = '';
    state.categories.slice(0, 14).forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = c;
      if (c === cur) b.className = 'on';
      b.onclick = function () { document.querySelector('[data-f="category"]').value = c; renderChips(); renderPreview(); };
      box.appendChild(b);
    });
  }

  function renderMapping(m) {
    if (!m) return;
    var body = $('mapBody'); body.innerHTML = '';
    var p = document.createElement('p');
    p.textContent = "'" + m.sheet + "' 시트 " + m.headerRow + '행 머리글에 맞춰 저장돼요.';
    body.appendChild(p);
    var t = document.createElement('table');
    m.columns.forEach(function (c) {
      var tr = t.insertRow();
      tr.insertCell().textContent = c.col + '열';
      tr.insertCell().textContent = c.header + (c.header.replace(/\s/g, '') !== c.field.replace(/\s/g, '') ? '  ← ' + c.field : '');
    });
    body.appendChild(t);
    var HELPERS = ['링크', '포스터', '발행호'];
    var skipped = m.missing.filter(function (x) { return HELPERS.indexOf(x) < 0; });
    var added = m.missing.filter(function (x) { return HELPERS.indexOf(x) >= 0; });
    if (skipped.length) addP('시트에 열이 없어 저장하지 않는 항목: ' + skipped.join(', '));
    if (added.length) addP(added.join('·') + ' 열은 첫 저장 때 시트 오른쪽 끝에 자동으로 추가돼요.');
    if (m.unmapped.length) addP('비워두는 열: ' + m.unmapped.join(', '));
    function addP(text) { var el = document.createElement('p'); el.textContent = text; body.appendChild(el); }
  }

  /* ───────── 1단계: 입력 ───────── */
  function updateMain() {
    var btn = $('mainBtn');
    if (state.mode === 'input') {
      btn.textContent = 'AI로 정리하기';
      btn.disabled = !($('caption').value.trim() || state.image);
    } else {
      btn.textContent = '시트에 저장하기';
      btn.disabled = false;
    }
  }

  $('caption').addEventListener('input', updateMain);

  function setImage(img) {
    state.image = img;
    show($('posterImg'), !!img); show($('clearImg'), !!img); show($('dropEmpty'), !img);
    $('file').classList.toggle('hidden', !!img);
    if (img) $('posterImg').src = 'data:' + img.mimeType + ';base64,' + img.data;
    else $('posterImg').removeAttribute('src');
    updateMain();
  }

  /** 휴대폰 사진은 커서 긴 변 1600px JPEG로 줄여서 보냅니다. */
  function readImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * r); c.height = Math.round(h * r);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve({ mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.88).split(',')[1] });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없어요. (HEIC라면 스크린샷으로 올려주세요)')); };
      img.src = url;
    });
  }

  function takeFile(file) {
    if (!file || !/^image\//.test(file.type)) return;
    readImage(file).then(setImage).catch(function (e) { toast(errMsg(e)); });
  }

  $('file').addEventListener('change', function (e) { takeFile(e.target.files[0]); e.target.value = ''; });
  $('clearImg').addEventListener('click', function (e) { e.preventDefault(); setImage(null); });
  var drop = $('drop');
  drop.addEventListener('dragover', function (e) { e.preventDefault(); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); takeFile(e.dataTransfer.files[0]); });
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) { takeFile(items[i].getAsFile()); e.preventDefault(); return; }
    }
  });

  $('fetchBtn').onclick = function () {
    var url = $('link').value.trim();
    if (!url) { note($('fetchNote'), '링크를 먼저 넣어주세요.', 'warn'); return; }
    loading(true, '인스타그램에서 불러오는 중…', '몇 초 걸릴 수 있어요');
    call('fetchInstagram', url).then(function (r) {
      loading(false);
      if (r.caption && !$('caption').value.trim()) $('caption').value = r.caption;
      if (r.image && !state.image) setImage(r.image);
      note($('fetchNote'), r.message, r.ok ? 'ok' : 'warn');
      updateMain();
    }).catch(function (e) { loading(false); note($('fetchNote'), errMsg(e), 'err'); });
  };

  /* ───────── 2단계: AI 정리 ───────── */
  // 구글 AI가 붐빌 때 자동으로 기다렸다가 다시 시도하는 간격(초)
  var RETRY_WAITS = [15, 30, 45];
  var retryTimer = null;

  function analyze() { runAnalyze(0, false); }

  function runAnalyze(attempt, basic) {
    clearInterval(retryTimer);
    show($('skipBtn'), false);
    loading(true, basic ? '캡션에서 정보를 찾는 중…' : 'AI가 행사 정보를 정리하는 중…',
      basic ? '' : attempt ? '다시 시도하는 중 (' + attempt + '/' + RETRY_WAITS.length + ')' : '포스터와 캡션을 읽고 있어요 (10~40초)');
    var input = { link: $('link').value.trim(), caption: $('caption').value.trim(), image: state.image };
    call('analyzeEvent', input, { basic: basic })
      .then(function (r) {
        loading(false);
        showResult(r);
      })
      .catch(function (e) {
        if (!basic && isBusy(e)) return waitAndRetry(attempt);
        loading(false);
        toast(errMsg(e));
      });
  }

  /** AI가 붐비면 카운트다운 후 자동 재시도, 다 실패하면 캡션 기반 기본 정리 */
  function waitAndRetry(attempt) {
    if (attempt >= RETRY_WAITS.length) return runAnalyze(attempt, true);
    var left = RETRY_WAITS[attempt];
    function tick() {
      loading(true, '구글 AI가 지금 붐벼요', left + '초 뒤에 자동으로 다시 시도해요 (' + (attempt + 1) + '/' + RETRY_WAITS.length + ')');
      if (left-- <= 0) { clearInterval(retryTimer); runAnalyze(attempt + 1, false); }
    }
    show($('skipBtn'), true);
    tick();
    retryTimer = setInterval(tick, 1000);
  }

  $('skipBtn').onclick = function () { clearInterval(retryTimer); runAnalyze(RETRY_WAITS.length, true); };

  function showResult(r) {
    state.event = r.event;
    if (r.categories) setCategories(r.categories);
    fillResult(r);
    note($('basicNote'), r.basic ? 'AI가 붐벼서 캡션에서 찾을 수 있는 정보만 채웠어요. 노란 칸을 확인해서 채운 뒤 저장해주세요. (잠시 뒤 "처음부터 다시"로 AI 정리를 다시 해도 돼요)' : '', 'warn');
    state.mode = 'result'; updateMain();
    show($('resultCard'), true);
    $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function fields() { return Array.prototype.slice.call(document.querySelectorAll('[data-f]')); }

  function fillResult(r) {
    var ev = r.event;
    var important = ['category', 'host', 'account', 'title', 'startDate', 'venue', 'region', 'summary'];
    fields().forEach(function (el) { el.value = ev[el.dataset.f] || ''; });
    document.querySelectorAll('[data-k]').forEach(function (box) {
      box.classList.toggle('missing', important.indexOf(box.dataset.k) >= 0 && !ev[box.dataset.k]);
    });
    renderChips();
    note($('dupNote'), r.duplicate ? '이미 등록된 링크예요: ' + r.duplicate.issue + ' 호 「' + r.duplicate.title + '」' : '', 'warn');
    renderPreview();
  }

  function readForm() {
    var ev = {};
    Object.keys(state.event || {}).forEach(function (k) { ev[k] = state.event[k]; });
    fields().forEach(function (el) { ev[el.dataset.f] = el.value.trim(); });
    return ev;
  }

  function renderPreview() {
    var ev = readForm();
    $('pvTitle').textContent = ev.title || '(행사명)';
    $('pvCat').textContent = ev.category || '';
    $('pvDate').textContent = '일시 · ' + (fmtDateTime(ev, false) || '미정');
    $('pvVenue').textContent = '장소 · ' + (ev.venue || '미정');
    var end = parseYmd(ev.endDate || ev.startDate), issue = parseYmd(ev.issue);
    note($('pastNote'), end && issue && end < issue ? '행사가 발행일(' + fmtDay(issue) + ') 전에 끝나요. 발행호를 확인해주세요.' : '', 'warn');
  }

  document.addEventListener('input', function (e) {
    if (!e.target.dataset || !e.target.dataset.f) return;
    renderPreview();
    if (e.target.dataset.f === 'category') renderChips();
  });

  /* ───────── 3단계: 저장 ───────── */
  function save() {
    var ev = readForm();
    if (!ev.title) { toast('행사명을 입력해주세요'); return; }
    loading(true, '시트에 저장하는 중…', '포스터도 드라이브에 올리고 있어요');
    call('saveEvent', ev, state.image).then(function (d) {
      loading(false);
      renderDashboard(d);
      toast('저장 완료! 주간바자 시트도 갱신했어요');
      reset();
    }).catch(function (e) { loading(false); toast(errMsg(e)); });
  }

  function reset() {
    $('link').value = ''; $('caption').value = ''; setImage(null);
    note($('fetchNote'), ''); state.event = null; state.mode = 'input';
    show($('resultCard'), false); updateMain();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('resetBtn').onclick = reset;
  $('mainBtn').onclick = function () { state.mode === 'input' ? analyze() : save(); };

  boot();
</script>
</body>
</html>
